<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contribution Verifier</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #161923;
    --border: #262b3a;
    --text: #e7e9ee;
    --muted: #9aa1b2;
    --accent: #6c8cff;
    --ok: #3ddc97;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .status.pending { display: block; background: #1c2030; color: var(--muted); }
  .status.ok { display: block; background: rgba(61,220,151,0.1); color: var(--ok); border: 1px solid rgba(61,220,151,0.3); }
  .status.err { display: block; background: rgba(255,107,107,0.1); color: var(--err); border: 1px solid rgba(255,107,107,0.3); }
  .badges {
    margin-top: 24px;
  }
  .badges h2 {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .badge {
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    word-break: break-all;
    color: var(--text);
  }
  .footer-note {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="card">
  <h1>GitHub Contribution Verifier</h1>
  <p class="sub">Submit a merged PR. Validators independently verify it on-chain.</p>

  <label for="contract">Contract address</label>
  <input id="contract" placeholder="0x..." />

  <label for="repo">Expected repo (org/repo)</label>
  <input id="repo" placeholder="genlayerlabs/genlayer" />

  <label for="prUrl">PR URL</label>
  <input id="prUrl" placeholder="https://github.com/org/repo/pull/123" />

  <button id="submitBtn">Verify contribution</button>

  <div id="status" class="status"></div>

  <div class="badges">
    <h2>Your verified PRs</h2>
    <div id="badgeList"></div>
  </div>

  <p class="footer-note">
    Connects to a GenLayer network via a browser wallet. Verification runs
    through the contract's <code>verify_pr</code> method and reads back via
    <code>get_verified</code>.
  </p>
</div>

<!--
  genlayer-js is loaded from a CDN here for a zero-build demo.
  Before shipping: confirm the current package name / CDN path and the
  current client initialization API against the latest GenLayer docs —
  this SDK's API has moved fast historically.
-->
<script type="module">
  import { createClient, createAccount } from "https://esm.sh/genlayer-js";

  const els = {
    contract: document.getElementById("contract"),
    repo: document.getElementById("repo"),
    prUrl: document.getElementById("prUrl"),
    submitBtn: document.getElementById("submitBtn"),
    status: document.getElementById("status"),
    badgeList: document.getElementById("badgeList"),
  };

  function setStatus(kind, text) {
    els.status.className = `status ${kind}`;
    els.status.textContent = text;
  }

  async function getClient() {
    // In production, connect to the user's injected wallet instead of a
    // freshly generated account. This is left simple for the demo.
    const account = createAccount();
    const client = createClient({ account });
    return client;
  }

  async function refreshBadges(client, contractAddress, address) {
    try {
      const verified = await client.readContract({
        address: contractAddress,
        functionName: "get_verified",
        args: [address],
      });
      els.badgeList.innerHTML = "";
      if (!verified || verified.length === 0) {
        els.badgeList.innerHTML = `<div class="badge">No verified contributions yet.</div>`;
        return;
      }
      for (const url of verified) {
        const div = document.createElement("div");
        div.className = "badge";
        div.textContent = url;
        els.badgeList.appendChild(div);
      }
    } catch (e) {
      console.error("Failed to read verified contributions", e);
    }
  }

  els.submitBtn.addEventListener("click", async () => {
    const contractAddress = els.contract.value.trim();
    const repo = els.repo.value.trim();
    const prUrl = els.prUrl.value.trim();

    if (!contractAddress || !repo || !prUrl) {
      setStatus("err", "Fill in the contract address, repo, and PR URL first.");
      return;
    }

    els.submitBtn.disabled = true;
    setStatus("pending", "Submitting to the network — waiting for validator consensus...");

    try {
      const client = await getClient();

      const txHash = await client.writeContract({
        address: contractAddress,
        functionName: "verify_pr",
        args: [prUrl, repo],
      });

      setStatus("pending", `Transaction sent (${txHash}). Waiting for confirmation...`);

      const receipt = await client.waitForTransactionReceipt({ hash: txHash });

      if (receipt.status === "success" || receipt.status === "ACCEPTED") {
        setStatus("ok", "Verified! This PR is now recorded as a confirmed contribution.");
        await refreshBadges(client, contractAddress, client.account.address);
      } else {
        setStatus("err", "Validators could not verify this PR (not merged, or repo mismatch).");
      }
    } catch (e) {
      console.error(e);
      setStatus("err", `Something went wrong: ${e.message || e}`);
    } finally {
      els.submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
